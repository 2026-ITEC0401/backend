# DEPLOYMENT GATE - DO NOT INSTALL YET.
#
# systemd-journald retention is system-wide; it cannot shorten only Hearo's
# ordinary service messages while preserving authentication, authorization,
# administrator-action, and other security/audit evidence. Install this drop-in
# only after those audit events are routed to a separate access-controlled
# store with a retention period of at least one calendar year and the routing
# has been verified. "365 days" is not always a full Gregorian calendar year
# across a leap-day boundary, so the audit policy must be expressed and tested
# as a calendar-year requirement.
#
# Once that gate is satisfied, these settings bound the remaining journal data
# to 90 days and roll journal files daily. journald expiration is space- and
# maintenance-cycle based, so monitoring is still required.
[Journal]
MaxRetentionSec=90day
MaxFileSec=1day
