per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/hearo-passwd
acl_file /etc/mosquitto/hearo-acl

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60

listener 8883
protocol mqtt
certfile /etc/mosquitto/certs/hearo-fullchain.pem
keyfile /etc/mosquitto/certs/hearo-privkey.pem
cafile /etc/mosquitto/certs/hearo-chain.pem
tls_version tlsv1.2
require_certificate false

log_dest syslog
connection_messages true
log_type error
log_type warning
log_type notice

# Port 1883 is intentionally not exposed. New and migration topics both travel
# over TLS 8883; remove old topic ACL entries after all clients are upgraded.
